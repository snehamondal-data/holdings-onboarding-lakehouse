source_id: scale_book
display_name: Scale test book of record, gzipped (synthetic)
kind: book_of_record
format: csv
landing_subdir: book_of_record
file_glob: "*.csv.gz"
options:
  delimiter: ","
  header: true
bronze_table: bronze_scale_book
columns: [as_of_date, account_id, custodian, security_id, quantity, currency]
rules:
  required: [as_of_date, account_id, custodian, security_id, quantity]
  numeric: [quantity]
  dates:
    as_of_date: "yyyy-MM-dd"
silver:
  target: positions
  position_side: book
  fields:
    account_id: account_id
    business_date: as_of_date
    quantity: quantity
    currency: currency          # the book carries no price or value; gold values it
  identifier:
    type: security_id           # already the internal id; still checked against the master
    columns: [security_id]
  market_value_multiplier: 1
  dedupe: exact
