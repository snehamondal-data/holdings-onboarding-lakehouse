source_id: prices
display_name: Daily closing prices (reference)
kind: reference
format: csv
landing_subdir: reference/prices
file_glob: "*.csv"
options:
  delimiter: ","
  header: true
bronze_table: bronze_prices
columns: [price_date, security_id, close_price, currency]
rules:
  required: [price_date, security_id, close_price]
  numeric: [close_price]
  dates:
    price_date: "yyyy-MM-dd"
silver:
  target: prices
  key: [price_date, security_id]
  fields:
    price_date: date
    security_id: string
    close_price: "decimal(38,6)"
    currency: string
  dedupe: exact
