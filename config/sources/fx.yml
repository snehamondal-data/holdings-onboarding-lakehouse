source_id: fx
display_name: Daily FX rates to USD (reference)
kind: reference
format: csv
landing_subdir: reference/fx
file_glob: "*.csv"
options:
  delimiter: ","
  header: true
bronze_table: bronze_fx
columns: [rate_date, currency, usd_per_unit]
rules:
  required: [rate_date, currency, usd_per_unit]
  numeric: [usd_per_unit]
  dates:
    rate_date: "yyyy-MM-dd"
silver:
  target: fx
  key: [rate_date, currency]
  fields:
    rate_date: date
    currency: string
    usd_per_unit: "decimal(38,8)"
  dedupe: exact
