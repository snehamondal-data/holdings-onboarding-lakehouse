# Notebook tasks on serverless (spark_python_task cannot read bundle files on this
# Free Edition workspace). No retries in dev: a quota error stops the run.
resources:
  jobs:
    slice1_bronze:
      name: keelstone-slice1-bronze-${var.client}
      max_concurrent_runs: 1
      tasks:
        - task_key: setup_uc
          max_retries: 0
          notebook_task:
            notebook_path: ../jobs/setup_uc.py
            base_parameters: {client: "${var.client}"}
        - task_key: ingest_bronze
          depends_on: [{task_key: setup_uc}]
          max_retries: 0
          notebook_task:
            notebook_path: ../jobs/ingest_bronze.py
            base_parameters: {client: "${var.client}",
                              run_id: "{{job.run_id}}-ingest"}
        - task_key: ingest_bronze_rerun
          depends_on: [{task_key: ingest_bronze}]
          max_retries: 0
          notebook_task:
            notebook_path: ../jobs/ingest_bronze.py
            base_parameters: {client: "${var.client}",
                              run_id: "{{job.run_id}}-rerun", expect_no_new_files: "true"}
        - task_key: validate_slice1
          depends_on: [{task_key: ingest_bronze_rerun}]
          max_retries: 0
          notebook_task:
            notebook_path: ../jobs/validate_slice1.py
            base_parameters: {client: "${var.client}",
                              rerun_id: "{{job.run_id}}-rerun"}
