# GENERATED by scripts/render_client_resources.py from config/clients/scale_test.yml. Do not edit.
resources:
  pipelines:
    pipeline_scale_test:
      name: keelstone-silver-gold-scale_test
      catalog: keelstone
      schema: scale_test
      serverless: true
      continuous: false
      channel: CURRENT
      configuration:
        keelstone.client: scale_test
        keelstone.config_dir: ${var.config_dir}
      environment:
        dependencies:
        - ${var.wheel_path}
      libraries:
      - file:
          path: ../../pipelines/silver_gold.py
  jobs:
    client_scale_test:
      name: keelstone-client-scale_test
      max_concurrent_runs: 1
      queue:
        enabled: true
      parameters:
      - name: first_update
        default: incremental
      - name: idempotency_check
        default: 'false'
      - name: perf_label
        default: unlabelled
      tasks:
      - task_key: setup_uc
        max_retries: 0
        notebook_task:
          notebook_path: ../../jobs/setup_uc.py
          base_parameters:
            client: scale_test
      - task_key: ingest_bronze
        depends_on:
        - task_key: setup_uc
        max_retries: 0
        notebook_task:
          notebook_path: ../../jobs/ingest_bronze.py
          base_parameters:
            client: scale_test
            run_id: '{{job.run_id}}-ingest'
      - task_key: wait_for_pipeline_slot
        depends_on:
        - task_key: ingest_bronze
        max_retries: 0
        notebook_task:
          notebook_path: ../../jobs/wait_for_pipeline_slot.py
          base_parameters:
            client: scale_test
      - task_key: choose_first_update
        depends_on:
        - task_key: wait_for_pipeline_slot
        max_retries: 0
        condition_task:
          op: EQUAL_TO
          left: '{{job.parameters.first_update}}'
          right: full_refresh
      - task_key: update_full_refresh
        depends_on:
        - task_key: choose_first_update
          outcome: 'true'
        max_retries: 2
        min_retry_interval_millis: 300000
        pipeline_task:
          pipeline_id: ${resources.pipelines.pipeline_scale_test.id}
          full_refresh: true
      - task_key: update_incremental
        depends_on:
        - task_key: choose_first_update
          outcome: 'false'
        max_retries: 2
        min_retry_interval_millis: 300000
        pipeline_task:
          pipeline_id: ${resources.pipelines.pipeline_scale_test.id}
          full_refresh: false
      - task_key: choose_idempotency_check
        depends_on:
        - task_key: update_full_refresh
        - task_key: update_incremental
        run_if: AT_LEAST_ONE_SUCCESS
        max_retries: 0
        condition_task:
          op: EQUAL_TO
          left: '{{job.parameters.idempotency_check}}'
          right: 'true'
      - task_key: snapshot_after_update
        depends_on:
        - task_key: choose_idempotency_check
          outcome: 'true'
        max_retries: 0
        notebook_task:
          notebook_path: ../../jobs/validate_silver_snapshot.py
          base_parameters:
            client: scale_test
            run_tag: '{{job.run_id}}'
            label: 1_update
      - task_key: rerun
        depends_on:
        - task_key: snapshot_after_update
        max_retries: 2
        min_retry_interval_millis: 300000
        pipeline_task:
          pipeline_id: ${resources.pipelines.pipeline_scale_test.id}
          full_refresh: false
      - task_key: snapshot_after_rerun
        depends_on:
        - task_key: rerun
        max_retries: 0
        notebook_task:
          notebook_path: ../../jobs/validate_silver_snapshot.py
          base_parameters:
            client: scale_test
            run_tag: '{{job.run_id}}'
            label: 2_rerun
      - task_key: full_refresh
        depends_on:
        - task_key: snapshot_after_rerun
        max_retries: 2
        min_retry_interval_millis: 300000
        pipeline_task:
          pipeline_id: ${resources.pipelines.pipeline_scale_test.id}
          full_refresh: true
      - task_key: snapshot_after_full_refresh
        depends_on:
        - task_key: full_refresh
        max_retries: 0
        notebook_task:
          notebook_path: ../../jobs/validate_silver_snapshot.py
          base_parameters:
            client: scale_test
            run_tag: '{{job.run_id}}'
            label: 3_full_refresh
      - task_key: validate_bronze
        depends_on:
        - task_key: choose_idempotency_check
          outcome: 'false'
        - task_key: snapshot_after_full_refresh
        run_if: AT_LEAST_ONE_SUCCESS
        max_retries: 0
        notebook_task:
          notebook_path: ../../jobs/validate_slice1.py
          base_parameters:
            client: scale_test
      - task_key: validate_silver
        depends_on:
        - task_key: validate_bronze
        max_retries: 0
        notebook_task:
          notebook_path: ../../jobs/validate_slice2.py
          base_parameters:
            client: scale_test
            run_tag: '{{job.run_id}}'
            require_snapshots: '{{job.parameters.idempotency_check}}'
      - task_key: validate_gold
        depends_on:
        - task_key: validate_silver
        max_retries: 0
        notebook_task:
          notebook_path: ../../jobs/validate_slice3.py
          base_parameters:
            client: scale_test
            run_tag: '{{job.run_id}}'
            require_snapshots: '{{job.parameters.idempotency_check}}'
      - task_key: measure_performance
        depends_on:
        - task_key: validate_gold
        run_if: ALL_DONE
        max_retries: 0
        notebook_task:
          notebook_path: ../../jobs/measure_performance.py
          base_parameters:
            client: scale_test
            job_run_id: '{{job.run_id}}'
            label: '{{job.parameters.perf_label}}'
  dashboards:
    gold_scale_test:
      display_name: Keelstone gold overview (scale_test, synthetic data)
      file_path: ../../dashboards/scale_test.lvdash.json
      warehouse_id: ${var.warehouse_id}
