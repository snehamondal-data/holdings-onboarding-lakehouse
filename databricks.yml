# Databricks Asset Bundle (Declarative Automation Bundle). Free Edition: serverless only.
bundle:
  name: holdings-onboarding-lakehouse

include:
  - resources/*.yml

variables:
  client:
    description: Client config to run (config/clients/<client>.yml)
    default: calder_valley
  wheel_path:
    description: Content-versioned project wheel for pipelines (set by scripts/deploy.py)
    default: /Volumes/keelstone/platform/artifacts/keelstone_holdings-0.1.0-py3-none-any.whl
  config_dir:
    description: YAML configs uploaded by scripts/deploy.py
    default: /Volumes/keelstone/platform/artifacts/config

targets:
  dev:
    mode: development
    default: true
    workspace:
      # Host comes from the CLI profile (~/.databrickscfg), so no workspace URL is committed.
      profile: keelstone

sync:
  exclude:
    - data/**
    - .venv/**
    - tests/**
    - dist/**
