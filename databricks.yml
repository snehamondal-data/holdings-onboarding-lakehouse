# Databricks Asset Bundle (Declarative Automation Bundle). Free Edition: serverless only.
bundle:
  name: holdings-onboarding-lakehouse

include:
  - resources/*.yml
  - resources/clients/*.yml

variables:
  client:
    description: Client config to run (config/clients/<client>.yml)
    default: calder_valley
  wheel_path:
    description: Content-versioned project wheel for pipelines (set by scripts/deploy.py)
    default: /Volumes/keelstone/platform/artifacts/keelstone_holdings-0.1.0-py3-none-any.whl
  warehouse_id:
    description: SQL warehouse for the AI/BI dashboard
    lookup:
      warehouse: Serverless Starter Warehouse
  config_dir:
    description: YAML configs uploaded by scripts/deploy.py
    default: /Volumes/keelstone/platform/artifacts/config

targets:
  dev:
    mode: development
    default: true
    workspace:
      # Host comes from the CLI profile (~/.databrickscfg), so no workspace URL is committed.
      profile: keelstone

  demo:
    # The same resources without the "[dev <user>]" name prefix, for screenshots and demos.
    # Deploy it instead of dev, not beside it: a table can be managed by only one pipeline,
    # so two targets must not both run pipelines for the same client schemas.
    # No mode: development mode would add the prefix (an empty name_prefix is ignored there).
    workspace:
      profile: keelstone
      root_path: ~/.bundle/${bundle.name}/demo

sync:
  exclude:
    - data/**
    - .venv/**
    - tests/**
    - dist/**
